<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" th:href="@{https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css}" />
    <title>Eventbrite Login</title>
</head>
<body class="min-h-screen bg-cover bg-center bg-no-repeat flex items-center justify-center focus:outline-none focus:ring-0 select-none"
      th:style="'background-image: url(' + @{/images/ev1.jpg} + ');'">

<div class="bg-white bg-opacity-90 backdrop-blur-md rounded-2xl shadow-xl p-8 md:p-12 w-full max-w-md mx-4">
    <div class="flex flex-col items-center">
        <img th:src="@{/images/ev0.png}" alt="Eventbrite Logo" class="w-28 mb-4" />
        <h1 class="text-2xl md:text-3xl font-bold text-blue-950 text-center mb-2">Welcome to EventBrite</h1>
        <p class="text-sm md:text-base text-blue-900 text-center mb-6">Transforming your event into a thriving business</p>
    </div>

    <form th:action="@{/login}" method="POST" class="space-y-4">
        <div>
            <label class="block text-sm font-semibold text-blue-950 mb-1">Email</label>
            <input type="email" name="email" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Enter your email" />
        </div>

        <div>
            <label class="block text-sm font-semibold text-blue-950 mb-1">Username</label>
            <input type="text" name="username" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Enter your username" />
        </div>

        <div>
            <label class="block text-sm font-semibold text-blue-950 mb-1">Password</label>
            <input type="password" name="password" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Enter your password" />
        </div>

        <button type="submit" class="w-full bg-orange-500 hover:bg-orange-600 text-white font-semibold py-3 rounded-lg transition">Login</button>
    </form>

    <p class="text-sm text-center text-gray-700 mt-4">
        Don't have an account? <a th:href="@{/signup}" class="text-blue-600 hover:underline">Sign up</a>
    </p>

    <p class="text-xs text-center text-gray-600 mt-4 px-4">
        By clicking login or the Apple, Google, or Facebook icons, you agree to Eventbrite's
        <a href="#" class="text-blue-600 hover:underline">Terms of Service</a> and
        <a href="#" class="text-blue-600 hover:underline">Privacy Policy</a>.
    </p>

    <div class="flex justify-center items-center space-x-6 mt-6">
        <a href="#" class="text-2xl text-black hover:scale-110 transition">
            <i class="fa-brands fa-apple"></i>
        </a>
        <a href="#" class="hover:scale-110 transition">
            <img th:src="@{/images/g1.png}" alt="Google Icon" class="w-6 inline-block align-middle" />
        </a>
        <a href="#" class="text-2xl text-blue-700 hover:scale-110 transition">
            <i class="fa-brands fa-facebook"></i>
        </a>
    </div>

    <div class="text-center mt-6">
        <a href="#" class="text-sm text-blue-600 hover:underline">Need help finding your tickets?</a>
    </div>
</div>

</body>
</html>
