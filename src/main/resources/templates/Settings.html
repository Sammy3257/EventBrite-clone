<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Setting</title>
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <script src="//unpkg.com/alpinejs" defer></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="select-none">
<div x-data="{ sidebarOpen: false, userDropdownOpen: false }" class="min-h-screen">

    <!-- Top Navigation Bar -->
    <nav class="fixed top-0 left-0 right-0 z-50 bg-gradient-to-r from-gray-100 to-gray-200 shadow px-6 py-4 flex items-center justify-between">

        <!-- Logo -->
        <div class="flex items-center gap-4">
            <img th:src="@{/images/ev0.png}" alt="Logo" class="w-36" />
        </div>

        <!-- Navigation Actions -->
        <div class="flex items-center gap-4">

            <!-- User Dropdown -->
            <div class="relative" @keydown.escape="userDropdownOpen = false">
                <!-- Avatar Button -->
                <button @click="userDropdownOpen = !userDropdownOpen"
                        class="flex items-center gap-2 bg-gray-100 hover:bg-gray-200 text-blue-900 rounded-full shadow transition-all">
                    <img :src="$store.profile.imageUrl || 'https://via.placeholder.com/40'"
                         alt="User Avatar"
                         class="w-10 h-10 rounded-full object-cover" />
                </button>

                <!-- Dropdown -->
                <div x-show="userDropdownOpen" @click.away="userDropdownOpen = false" x-transition
                     class="absolute right-0 mt-2 w-64 bg-white border rounded-lg shadow-lg z-50">
                    <div class="p-4 border-b text-sm text-gray-700">
                        <div class="flex items-center gap-2">
                            <i class="fa fa-envelope text-blue-500"></i>
                            <span>user@example.com</span>
                        </div>
                    </div>

                    <a href="#" class="flex items-center px-4 py-3 text-sm text-gray-800 hover:bg-gray-100">
                        <i class="fa fa-exchange-alt mr-3"></i> Switch to Attendance
                    </a>

                    <!-- Open Profile Settings Modal -->
                    <button @click="$store.profile.profileModalOpen = true; userDropdownOpen = false"
                            class="w-full text-left flex items-center px-4 py-3 text-sm text-gray-800 hover:bg-gray-100">
                        <i class="fa fa-user mr-3"></i> Account Settings
                    </button>

                    <hr class="my-1" />

                    <a href="#" class="flex items-center px-4 py-3 text-sm text-red-600 hover:bg-red-50">
                        <i class="fas fa-sign-out-alt mr-3"></i> Logout
                    </a>
                </div>
            </div>

        </div>
    </nav>

    <!-- Spacer for fixed navbar -->
    <div class="h-20"></div>

    <!-- Profile Settings Modal -->
    <div x-show="$store.profile.profileModalOpen" x-transition
         class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-50">

        <div @click.away="$store.profile.profileModalOpen = false"
             class="bg-white w-full max-w-md mx-auto rounded-xl shadow-lg p-6 space-y-5">

            <!-- Modal Header -->
            <div class="flex justify-between items-center">
                <h2 class="text-xl font-semibold">Edit Profile</h2>
                <button @click="$store.profile.profileModalOpen = false" class="text-gray-500 hover:text-gray-700">
                    <i class="fas fa-times"></i>
                </button>
            </div>

            <!-- Profile Image with Preview and Upload -->
            <div class="flex flex-col items-center">
                <img :src="$store.profile.imageUrl || 'https://via.placeholder.com/100'"
                     class="w-24 h-24 rounded-full object-cover border-2 border-blue-500" />
                <label class="mt-2 text-sm text-blue-600 cursor-pointer hover:underline">
                    Change Photo
                    <input type="file" class="hidden" @change="$store.profile.handleImageUpload($event)" />
                </label>
            </div>

            <!-- Form -->
            <form class="space-y-3" @submit.prevent="alert('Profile saved! You can hook this up to your backend!')">
                <input type="text" placeholder="Full Name" class="w-full p-2 border rounded" required />
                <input type="email" placeholder="Email" class="w-full p-2 border rounded" required />
                <input type="password" placeholder="New Password" class="w-full p-2 border rounded" />

                <div class="flex justify-end space-x-2 pt-2">
                    <button type="button" @click="$store.profile.profileModalOpen = false"
                            class="px-4 py-2 bg-gray-200 rounded hover:bg-gray-300">Cancel</button>
                    <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">Save</button>
                </div>
            </form>
        </div>
    </div>


    <!-- Sidebar -->
    <aside class="fixed top-[4.5rem] left-0 z-40 w-64 h-[calc(100vh-4.5rem)] bg-gray-100 border-r pt-3">
        <nav class="p-4 space-y-8 text-m">
            <a th:href="@{/home}" class="flex items-center px-4 py-2 text-black hover:bg-blue-100 rounded-md">
                <i class="fas fa-home text-blue-500 w-5"></i><span class="ml-3">Home</span>
            </a>
            <a th:href="@{/marketing}" class="flex items-center px-4 py-2 text-black hover:bg-blue-100 rounded-md">
                <i class="fas fa-bullhorn text-blue-500 w-5"></i><span class="ml-3">Marketing</span>
            </a>
            <a th:href="@{/reports/{id}(id=${event.id})}" class="flex items-center px-4 py-2 text-black hover:bg-blue-100 rounded-md">
                <i class="fas fa-chart-line text-blue-500 w-5"></i><span class="ml-3">Reports</span>
            </a>
            <a th:href="@{/Settings}" class="flex items-center px-4 py-2 text-black hover:bg-blue-100 rounded-md">
                <i class="fas fa-cog text-blue-500 w-5"></i><span class="ml-3">Settings</span>
            </a>
            <a href="#" class="flex items-center px-4 py-2 text-black hover:bg-blue-100 rounded-md">
                <i class="fas fa-question-circle text-blue-500 w-5"></i><span class="ml-3">Help</span>
            </a>
            <a href="#" class="flex items-center px-4 py-2 text-black hover:bg-blue-100 rounded-md">
                <i class="fas fa-ellipsis-h text-blue-500 w-5"></i><span class="ml-3">More</span>
            </a>
            <hr />
            <a th:href="@{/logout}"
               class="flex items-center px-4 py-2 text-black rounded-md
          hover:bg-red-100 hover:text-red-500 group">
                <i class="fa fa-sign-out w-5 text-blue-500 group-hover:text-red-500"></i>
                <span class="ml-3">Logout</span>
            </a>

        </nav>
    </aside>

    <main class=" md:pl-64 min-h-screen bg-gray-50">
        <div class="p-6">
    <h2 class="text-2xl font-bold text-gray-800 mt-7 ml-[70px]">Settings</h2>
    <div>
<div class="max-w-4xl mx-auto mt-10 px-6 py-8 bg-white rounded-lg shadow" x-data="{ notifications: true, darkMode: false }">

    <!-- Profile Image with Preview and Upload -->
    <div class="flex flex-col items-center mb-4">
        <label class="mt-2 text-sm text-blue-600 cursor-pointer hover:underline">
        <img :src="$store.profile.imageUrl || 'https://via.placeholder.com/100'" @change="$store.profile.handleImageUpload($event)"
             class="w-24 h-24 rounded-full object-cover border-2 border-blue-500" />


            <input type="file" class="hidden"   />
        </label>
    </div>
    <form action="#" method="POST">
        <!-- Profile Info -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
                <label class="block text-sm font-medium text-gray-700">Full Name</label>
                <input type="text" placeholder="John Doe" class="mt-1 block w-full border border-gray-300 rounded-md p-2" />
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700">Email</label>
                <input type="email" placeholder="organizer@example.com" class="mt-1 block w-full border border-gray-300 rounded-md p-2" />
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700">Organization Name</label>
                <input type="text" placeholder="EventPro Ltd." class="mt-1 block w-full border border-gray-300 rounded-md p-2" />
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700">Change Password</label>
                <input type="password" placeholder="New Password" class="mt-1 block w-full border border-gray-300 rounded-md p-2" />
            </div>
        </div>

        <!-- Preferences -->
        <div class="mt-8">
            <h3 class="text-lg font-semibold text-gray-700 mb-4">Preferences</h3>

            <div class="flex items-center justify-between mb-4">
                <label class="text-sm text-gray-600">Enable Email Notifications</label>
                <input type="checkbox" x-model="notifications" class="h-4 w-4 text-blue-600 border-gray-300 rounded" />
            </div>

            <div class="flex items-center justify-between mb-4">
                <label class="text-sm text-gray-600">Enable Dark Mode</label>
                <input type="checkbox" x-model="darkMode" class="h-4 w-4 text-blue-600 border-gray-300 rounded" />
            </div>
        </div>

        <!-- Actions -->
        <div class="flex justify-end gap-4 mt-6">
            <button type="reset" class="px-4 py-2 bg-gray-200 text-gray-700 rounded hover:bg-gray-300">
                Cancel
            </button>
            <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">
                Save Changes
            </button>
        </div>
    </form>
    </div>
    </div>
        </div>
</main>
</div>

</body>
<script>
    document.addEventListener('alpine:init', () => {
      Alpine.store('profile', {
        profileModalOpen: false,
        imageUrl: '',

        loadImage() {
          const storedImage = localStorage.getItem('profileImage');
          if (storedImage) this.imageUrl = storedImage;
        },

        handleImageUpload(event) {
          const file = event.target.files[0];
          if (!file) return;

          const reader = new FileReader();
          reader.onload = () => {
            this.imageUrl = reader.result;
            localStorage.setItem('profileImage', reader.result);
          };
          reader.readAsDataURL(file);
        }
      });

      Alpine.store('profile').loadImage();
    });
</script>

</html>
