<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" th:href="@{https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css}" />
    <title>Eventbrite Login</title>
</head>
<body class="min-h-screen bg-cover bg-center bg-no-repeat flex items-center justify-center select-none"
      th:style="'background-image: url(' + @{/images/ev1.jpg} + ');'">


<div class="bg-white shadow-2xl rounded-xl p-8 w-full max-w-md border border-gray-100 bg-gray-200">
    <div class="text-center">
        <img th:src="@{/images/ev0.png}" alt="Eventbrite Logo" class="w-24 mx-auto mb-4" />
        <h1 class="text-2xl font-extrabold text-blue-900">Login into Event Center</h1>
        <p class="text-sm text-gray-500 mt-1">You are logging in as an attendee</p>
    </div>

    <div th:if="${error}" class="mt-4 text-sm text-red-700 bg-red-100 border border-red-300 px-4 py-2 rounded" th:text="${error}"></div>
    <div th:if="${success}" class="mt-4 text-sm text-green-700 bg-green-100 border border-green-300 px-4 py-2 rounded" th:text="${success}"></div>

    <form th:action="@{/Attendee-login}" method="POST" class="mt-6 space-y-5">
        <div>
            <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email address</label>
            <input id="email" name="email" type="email" required
                   class="w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-1 focus:ring-blue-400 focus:outline-none"
                   placeholder="you@example.com" />
        </div>

        <div>
            <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
            <input id="password" name="password" type="password" required
                   class="w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-1 focus:ring-blue-400 focus:outline-none"
                   placeholder="••••••••" />
        </div>
<br>
        <button type="submit"
                class="w-full  bg-orange-500 hover:bg-orange-600 text-white text-sm font-bold py-3 rounded-full shadow-md transition">
            Log In
        </button>
    </form>

    <div class="mt-6 text-center">
        <p class="text-sm text-gray-600">
            Don't have an account?
            <a th:href="@{/signup}" class="text-orange-600 hover:underline font-medium">Create one</a>
        </p>
    </div>

    <div class="mt-6">
        <p class="text-xs text-center text-gray-500">
            By continuing, you agree to our
            <a href="#" class="text-blue-600 hover:underline">Terms</a> and
            <a href="#" class="text-blue-600 hover:underline">Privacy Policy</a>.
        </p>
    </div>

    <div class="flex justify-center gap-4 mt-6">
        <!-- Apple Icon -->
        <a href="#" class="w-10 h-10 flex items-center justify-center border border-gray-300 rounded-full hover:bg-gray-100 transition">
            <i class="fa-brands fa-apple text-xl text-black"></i>
        </a>

        <!-- Google Icon -->
        <a th:href="@{/oauth2/authorization/google}" class="w-10 h-10 flex items-center justify-center border border-gray-300 rounded-full hover:bg-gray-100 transition">
            <img th:src="@{/images/g1.png}" alt="Google Icon" class="w-5 h-5" />
        </a>

        <!-- Facebook Icon -->
        <a href="#" class="w-10 h-10 flex items-center justify-center border border-gray-300 rounded-full hover:bg-gray-100 transition">
            <i class="fa-brands fa-facebook-f text-xl text-blue-600"></i>
        </a>
    </div>


    <div class="mt-5 text-center">
        <a href="#" class="text-sm text-blue-500 hover:underline">Forgot your password?</a>
    </div>
</div>

</body>
</html>
