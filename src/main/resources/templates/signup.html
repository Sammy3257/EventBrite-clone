<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <title>Eventbrite Sign Up</title>
</head>
<body class="min-h-screen bg-cover bg-center bg-no-repeat flex items-center justify-center"
      th:style="'background-image: url(' + @{/images/ev1.jpg} + ');'">

<div class="bg-white shadow-xl border border-gray-200 rounded-2xl p-8 w-full max-w-md">
    <div class="text-center">
        <img th:src="@{/images/ev0.png}" alt="Eventbrite Logo" class="w-24 mx-auto mb-4" />
        <h1 class="text-2xl font-extrabold text-blue-900">Create an Account</h1>
        <p class="text-sm text-gray-500 mt-1">Join Event Center and start your journey</p>
    </div>

    <form th:action="@{/signup}" method="post" th:object="${user}" class="mt-6 space-y-5">
        <p th:if="${error}" th:text="${error}" class="text-sm text-red-600 bg-red-100 px-4 py-2 rounded-md"></p>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
            <input type="email" th:field="*{email}" required
                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-1 focus:ring-blue-400 focus:outline-none"
                   placeholder="you@example.com" />
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
            <input type="password" th:field="*{password}" required
                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-1 focus:ring-blue-400 focus:outline-none"
                   placeholder="Create a password" />
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Confirm Password</label>
            <input type="password" th:field="*{confirmPassword}" required
                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-1 focus:ring-blue-400 focus:outline-none"
                   placeholder="Re-enter your password" />
        </div>

        <button type="submit"
                class="w-full bg-orange-500 hover:bg-orange-600 text-white font-bold py-3 rounded-lg transition shadow-md">
            Sign Up
        </button>
    </form>

    <p class="text-sm text-center text-gray-600 mt-5">
        Already have an account?
        <a th:href="@{/login}" class="text-orange-600 hover:underline font-medium">Log in</a>
    </p>

    <p class="text-xs text-center text-gray-500 mt-4 px-4">
        By signing up, you agree to Eventbrite's
        <a th:href="@{/terms}" class="text-blue-600 hover:underline">Terms of Service</a> and
        <a th:href="@{/privacy}" class="text-blue-600 hover:underline">Privacy Policy</a>.
    </p>

    <div class="flex justify-center gap-4 mt-6">
        <a href="#" class="border border-gray-300 rounded-full p-2 hover:bg-gray-100 transition">
            <i class="fa-brands fa-apple text-xl text-black"></i>
        </a>
        <a th:href="@{/oauth2/authorization/google}" class="border border-gray-300 rounded-full p-2 hover:bg-gray-100 transition">
            <img th:src="@{/images/g1.png}" alt="Google Icon" class="w-5 h-5" />
        </a>
        <a href="#" class="border border-gray-300 rounded-full p-2 hover:bg-gray-100 transition">
            <i class="fa-brands fa-facebook text-xl text-blue-600"></i>
        </a>
    </div>

    <div class="text-center mt-6">
        <a href="#" class="text-sm text-blue-500 hover:underline">Need help finding your tickets?</a>
    </div>
</div>

</body>
</html>
